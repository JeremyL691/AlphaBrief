work_items:
  - id: M00-W01
    milestone_id: M00
    title: Replace historical documentation with the authoritative final set
    objective: Remove obsolete and redundant development documents, write the final OANDA-only blueprint and autonomous prompt suite, and update documentation acceptance without changing trading behavior.
    requirement_ids: []
    depends_on: []
    priority: 10
    initial_status: READY
    risk_class: normal
    scope_profile: governance
    allowed_paths:
      - .env.example
      - .gitignore
      - .claude/**
      - .hermes/**
      - .mimocode/**
      - .omo/**
      - .zcode/**
      - ALPHABRIEF_DEVELOPMENT_CADENCE.md
      - FINAL_ACCEPTANCE_REPORT.md
      - PROJECT_RULES.md
      - electron/README.md
      - reports/pre_flight_check_2026-06-26.md
      - config/alpaca_paper.yaml
      - config/oanda_paper.yaml
      - config/paper_execution_policy.yaml
      - packages/alphabrief-execution/src/alphabrief_execution/broker/alpaca/config.py
      - packages/alphabrief-execution/src/alphabrief_execution/broker/reconciliation.py
      - packages/alphabrief-trader/src/alphabrief_trader/schemas.py
      - apps/cli/src/alphabrief_cli/scheduler_commands.py
    size_budget: {max_production_files: 6, max_total_files: 75, max_changed_lines: 20000}
    acceptance:
      - {id: AC-M00-01, predicate: "Obsolete Phase, Round, roadmap, development-log, duplicated risk/model, and snapshot acceptance documents are absent from the working tree.", evidence_type: static_gate}
      - {id: AC-M00-02, predicate: "Every link in the new authoritative document set resolves and every YAML or NDJSON state file parses.", evidence_type: automated_test}
      - {id: AC-M00-03, predicate: "Scaffold and acceptance checks require only the new authority set and OANDA practice preflight contract.", evidence_type: automated_test}
      - {id: AC-M00-04, predicate: "Progress distinguishes the current routed and Alpaca baseline from the approved OANDA-only target.", evidence_type: static_gate}
      - {id: AC-M00-05, predicate: "No market, model, risk, broker, trader, or dashboard business behavior changes in this round.", evidence_type: static_gate}
    test_commands:
      targeted:
        - .venv/bin/python -m pytest -q tests/test_project_scaffold.py tests/test_acceptance_verifier.py tests/test_acceptance_api_cli.py
      integration: []
      static:
        - .venv/bin/ruff check packages/alphabrief-acceptance tests/test_project_scaffold.py tests/test_acceptance_verifier.py
        - .venv/bin/mypy
      regression:
        - .venv/bin/alphabrief acceptance verify --compact
      runtime: []
    documentation:
      update: [AGENTS.md, README.md, ALPHABRIEF_PRODUCT_BLUEPRINT.md, docs/architecture.md, docs/work_items.yaml, docs/progress.yaml, docs/acceptance.md, docs/oanda_30_day_runbook.md, docs/autonomous_loop.md, docs/development_ledger.ndjson]

  - id: M01-W01
    milestone_id: M01
    title: Lock core policy and configuration to OANDA practice
    objective: Make OANDA practice the only production policy value and add negative gates for live hosts, other brokers, and simulated fallback.
    requirement_ids: [REQ-PLAT-001, REQ-PLAT-002, REQ-PLAT-003]
    depends_on: [M00-W01]
    priority: 10
    initial_status: BACKLOG
    risk_class: safety-critical
    scope_profile: core_execution
    size_budget: {max_production_files: 8, max_total_files: 14, max_changed_lines: 900}
    acceptance:
      - {id: AC-M01-W01-01, predicate: "PaperExecutionPolicy accepts only provider oanda_paper and an OANDA-account market boundary.", evidence_type: automated_test}
      - {id: AC-M01-W01-02, predicate: "Production configuration cannot select a live host, another broker, routed mode, or simulated fallback.", evidence_type: static_gate}
      - {id: AC-M01-W01-03, predicate: "Missing credentials fail closed without generating an order or fill.", evidence_type: automated_test}
    test_commands:
      targeted: [.venv/bin/python -m pytest -q tests/test_execution_policy.py tests/test_oanda_adapter.py tests/test_acceptance_verifier.py]
      integration: []
      static: [.venv/bin/ruff check ., .venv/bin/mypy]
      regression: [.venv/bin/python -m pytest -q tests/test_project_scaffold.py tests/test_paper_execution.py]
      runtime: []
    documentation: {update: [docs/progress.yaml, docs/acceptance.md, docs/development_ledger.ndjson]}

  - id: M01-W02
    milestone_id: M01
    title: Delete Alpaca implementation, exports, configuration, and tests
    objective: Remove all Alpaca-specific production code, configuration, dependencies, helpers, and runtime tests while retaining only OANDA and test-local fakes.
    requirement_ids: [REQ-PLAT-001, REQ-PLAT-002]
    depends_on: [M01-W01]
    priority: 20
    initial_status: BACKLOG
    risk_class: execution-critical
    scope_profile: core_execution
    size_budget: {max_production_files: 16, max_total_files: 35, max_changed_lines: 3500}
    acceptance:
      - {id: AC-M01-W02-01, predicate: "Alpaca package, YAML, credential variables, imports, exports, scripts, and dedicated helpers are absent.", evidence_type: static_gate}
      - {id: AC-M01-W02-02, predicate: "The execution package imports and its public API contain no Alpaca surface.", evidence_type: automated_test}
      - {id: AC-M01-W02-03, predicate: "Removing old tests does not reduce coverage of broker-neutral and OANDA behavior; replacements exercise equivalent invariants.", evidence_type: automated_test}
    test_commands:
      targeted: [.venv/bin/python -m pytest -q tests/test_oanda_adapter.py tests/test_broker_adapter_singleton.py tests/test_broker_api_live.py]
      integration: [.venv/bin/python -m pytest -q tests/test_paper_execution.py tests/test_reconciliation.py]
      static: [.venv/bin/ruff check ., .venv/bin/mypy]
      regression: []
      runtime: []
    documentation: {update: [README.md, docs/progress.yaml, docs/acceptance.md, docs/development_ledger.ndjson]}

  - id: M01-W03
    milestone_id: M01
    title: Remove production broker routing and simulated fallback
    objective: Replace RoutingBrokerAdapter and production SimulatedBrokerAdapter composition with a fail-closed OANDA runtime port.
    requirement_ids: [REQ-PLAT-002, REQ-PLAT-003, REQ-EXEC-010]
    depends_on: [M01-W02]
    priority: 30
    initial_status: BACKLOG
    risk_class: safety-critical
    scope_profile: core_execution
    size_budget: {max_production_files: 12, max_total_files: 22, max_changed_lines: 1800}
    acceptance:
      - {id: AC-M01-W03-01, predicate: "Production dependency graphs cannot instantiate routing or an in-memory broker adapter.", evidence_type: static_gate}
      - {id: AC-M01-W03-02, predicate: "An unconfigured broker runtime reports not ready and cannot submit.", evidence_type: automated_test}
      - {id: AC-M01-W03-03, predicate: "Test fakes require an explicit test composition root and are unreachable from production settings.", evidence_type: automated_test}
    test_commands:
      targeted: [.venv/bin/python -m pytest -q tests/test_broker_adapter_singleton.py tests/test_broker_routing.py tests/test_ai_trader_execution_backend.py]
      integration: [.venv/bin/python -m pytest -q tests/test_broker_api_live.py tests/test_scheduler.py]
      static: [.venv/bin/ruff check ., .venv/bin/mypy]
      regression: []
      runtime: []
    documentation: {update: [docs/progress.yaml, docs/architecture.md, docs/acceptance.md, docs/development_ledger.ndjson]}

  - id: M01-W04
    milestone_id: M01
    title: Unify API, CLI, and scheduler OANDA runtime ownership
    objective: Make every application entry point acquire the same OANDA practice runtime authority and eliminate independently constructed broker state.
    requirement_ids: [REQ-EXEC-010, REQ-PLAT-005]
    depends_on: [M01-W03]
    priority: 40
    initial_status: BACKLOG
    risk_class: execution-critical
    scope_profile: core_execution
    size_budget: {max_production_files: 12, max_total_files: 24, max_changed_lines: 1800}
    acceptance:
      - {id: AC-M01-W04-01, predicate: "API lifespan, CLI broker commands, and scheduler resolve one runtime factory and persistent data directory authority.", evidence_type: automated_test}
      - {id: AC-M01-W04-02, predicate: "Two application entry points cannot expose conflicting in-memory account state.", evidence_type: automated_test}
      - {id: AC-M01-W04-03, predicate: "Shutdown closes OANDA clients and stores without discarding durable mappings.", evidence_type: automated_test}
    test_commands:
      targeted: [.venv/bin/python -m pytest -q tests/test_broker_adapter_singleton.py tests/test_broker_commands.py tests/test_scheduler.py]
      integration: [.venv/bin/python -m pytest -q tests/test_broker_api_live.py tests/test_ai_trader_scheduler.py]
      static: [.venv/bin/ruff check ., .venv/bin/mypy]
      regression: []
      runtime: []
    documentation: {update: [docs/progress.yaml, docs/architecture.md, docs/development_ledger.ndjson]}

  - id: M01-W05
    milestone_id: M01
