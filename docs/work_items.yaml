schema_version: 1
blueprint_version: "2026-08-13.1"
queue_id: alphabrief-oanda-final

policy:
  branch: main
  selection: dependency_then_priority_then_id
  auto_continue: true
  auto_commit: true
  auto_push: false
  allow_waivers: false
  live_trading: forbidden
  production_broker: oanda_paper
  production_simulated_fallback: forbidden
  reference_source_access_during_implementation: forbidden
  state_source: docs/progress.yaml
  artifact_root: .agent-artifacts
  checkpoint_file: .agent-state/current.yaml
  engineering_code_dependency_states: [DONE, CODE_COMPLETE]
  runtime_gate_dependency_states: [DONE, CODE_COMPLETE]
  observation_dependency_states: [DONE]
  engineering_ready_requires_all_m01_m15_done: true

global_forbidden_paths:
  - _reference_sources/**
  - .git/**
  - .venv/**
  - electron/node_modules/**
  - data/**
  - .env
  - "**/*secret*"
  - "**/*credential*"

completion_defaults:
  require_all_acceptance_pass: true
  require_clean_tree_after_commit: true
  allow_waivers: false
  max_same_failure_repairs: 3
  max_total_repair_cycles: 5
  max_external_retries: 2

scope_profiles:
  governance:
    allowed_paths:
