      - tests/test_project_scaffold.py
      - tests/test_acceptance_verifier.py
      - tests/test_acceptance_api_cli.py
      - .gitignore
    untouched_modules:
      - market data business logic
      - model business logic
      - risk business logic
      - broker and trading business logic
      - dashboard behavior
    static_commands:
      - .venv/bin/ruff check .
      - .venv/bin/mypy
