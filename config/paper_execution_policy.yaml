# Reviewed paper-only operating boundary. This file contains no credentials and
# never authorizes broker calls; all execution still requires RiskGate.
#
# Default broker: routed — FX / metals / index CFDs go to OANDA v20 practice;
# US stocks and crypto go to Alpaca paper. When a broker's credentials are not
# configured, its asset class degrades to the built-in simulated paper broker
# so the current baseline stays usable. This fallback is explicitly temporary
# and must be deleted by blueprint milestone M01 before formal observation.
#
# Universe: 34 instruments across FX majors/crosses, metals, index CFDs, US
# equities, and crypto. Symbols are internal AlphaBrief identifiers — Yahoo
# serves them natively (AAPL, BTC-USD, EURUSD=X) and the routed broker adapter
# maps each class to the right venue.
#
# Money units: max_order_notional and max_total_exposure are USD notional
# (quantity x reference price). The RiskGate enforces them as dollar caps.
mode: paper
provider: routed
market: multi_asset
symbols:
  # FX Majors (OANDA)
  - EUR_USD
  - GBP_USD
  - USD_JPY
  - USD_CHF
  - AUD_USD
  - USD_CAD
  - NZD_USD
  # FX Crosses (OANDA)
  - EUR_GBP
  - EUR_JPY
  - GBP_JPY
  - AUD_JPY
  - CHF_JPY
  # Metals (OANDA)
  - XAU_USD
  - XAG_USD
  # Index CFDs (OANDA)
  - US30_USD
  - SPX500_USD
  - NAS100_USD
  - DE30_EUR
  - JP225_USD
  # US Equities (Alpaca)
  - AAPL
  - MSFT
  - NVDA
  - TSLA
  - AMZN
  - META
  - GOOGL
  - AMD
  - SPY
  - QQQ
  # Crypto (Alpaca)
  - BTC-USD
  - ETH-USD
  - SOL-USD
  - XRP-USD
  - DOGE-USD
order_types: [market, limit]
timezone: America/New_York
trading_days: [mon, tue, wed, thu, fri]
session_start: "00:00"
session_end: "23:59"
# USD notional caps per order / total exposure.
max_order_notional: "2000"
max_total_exposure: "20000"
# Auto-execution: AI plans and manual paper orders execute immediately once
# the deterministic RiskGate approves them (paper mode only; live trading
# stays locked). Ethics veto, exposure caps, and the kill switch still bind.
require_human_review: false
automated_execution: true
