# Reviewed paper-only operating boundary. This file contains no credentials
# and never authorizes broker calls; all execution still requires RiskGate.
#
# OANDA v20 practice is the only production provider. The schema accepts
# provider: oanda_paper only; a live host, another broker, routed mode, or
# any in-memory fallback cannot be selected by this configuration. The
# practice endpoint is a constant in config/oanda_paper.yaml and cannot be
# overridden to a live host.
#
# Symbol list: FX majors, because the configured practice account returns
# CURRENCY instruments only. The trading universe is the intersection of
# this list with what GET /v3/accounts/{accountID}/instruments returns.
# Signal-only symbols (XAU_USD, SPX500_USD, BCO_USD) are read for context
# and are never orderable.
#
# Money units: max_order_notional and max_total_exposure are USD notional
# (quantity x reference price). The RiskGate enforces them as dollar caps.
mode: paper
provider: oanda_paper
market: fx
symbols:
  - EUR_USD
  - GBP_USD
  - USD_JPY
  - AUD_USD
  - USD_CAD
order_types: [market, limit]
timezone: America/New_York
trading_days: [mon, tue, wed, thu, fri]
session_start: "00:00"
session_end: "23:59"
# USD notional caps per order / total exposure.
max_order_notional: "2000"
max_total_exposure: "20000"
# Auto-execution: AI plans execute immediately once the deterministic
# RiskGate approves them (practice mode only). Ethics veto, exposure caps,
# and the kill switch still bind.
require_human_review: false
automated_execution: true
