# Reviewed paper-only operating boundary. This file contains no credentials
# and never authorizes broker calls; all execution still requires RiskGate.
#
# M01-W01: OANDA v20 practice is the only production provider. The schema
# accepts provider: oanda_paper only; a live host, another broker, routed
# mode, or any in-memory fallback cannot be selected by this configuration
# (REQ-PLAT-001 / REQ-PLAT-002). The practice endpoint is a constant in
# config/oanda_paper.yaml and cannot be overridden to a live host.
#
# Symbol list: a transitional operating allowlist for the deterministic
# RiskGate. The final universe is defined by what the configured OANDA
# practice account returns from GET /v3/accounts/{accountID}/instruments
# (blueprint milestone M04); until then the list below is the reviewed
# boundary, not a claim about account availability.
#
# Money units: max_order_notional and max_total_exposure are USD notional
# (quantity x reference price). The RiskGate enforces them as dollar caps.
mode: paper
provider: oanda_paper
market: multi_asset
symbols:
  # FX Majors
  - EUR_USD
  - GBP_USD
  - USD_JPY
  - USD_CHF
  - AUD_USD
  - USD_CAD
  - NZD_USD
  # FX Crosses
  - EUR_GBP
  - EUR_JPY
  - GBP_JPY
  - AUD_JPY
  - CHF_JPY
  # Metals
  - XAU_USD
  - XAG_USD
  # Index CFDs
  - US30_USD
  - SPX500_USD
  - NAS100_USD
  - DE30_EUR
  - JP225_USD
  # Transitional names; availability is confirmed per account in M04.
  - AAPL
  - MSFT
  - NVDA
  - TSLA
  - AMZN
  - META
  - GOOGL
  - AMD
  - SPY
  - QQQ
  - BTC-USD
  - ETH-USD
  - SOL-USD
  - XRP-USD
  - DOGE-USD
order_types: [market, limit]
timezone: America/New_York
trading_days: [mon, tue, wed, thu, fri]
session_start: "00:00"
session_end: "23:59"
# USD notional caps per order / total exposure.
max_order_notional: "2000"
max_total_exposure: "20000"
# Auto-execution: AI plans and manual paper orders execute immediately once
# the deterministic RiskGate approves them (paper mode only; the OANDA
# practice boundary is enforced by schema and acceptance gates). Ethics
# veto, exposure caps, and the kill switch still bind.
require_human_review: false
automated_execution: true
