# AlphaBrief non-secret configuration.
#
# Schema version 1. Unknown keys are rejected by the loader so a typo can
# never silently disable a safety-relevant setting.
schema_version: 1

model:
  # Free availability and pricing are rechecked per call, not guaranteed.
  primary_channel: openrouter_free
  fallback_enabled: false
  # Verified live 2026-10-22 with a real completion: exact model ID echoed,
  # zero catalog pricing (`cost: 0`), ~1.5s latency, valid JSON output.
  #
  # The previous model, nvidia/nemotron-3-super-120b-a12b:free, is still listed
  # in the catalog but every call returns HTTP 404 from the upstream provider
  # ("Function 'ac74...' Not found for account"), so no committee round could
  # succeed. Availability is rechecked per call and never assumed.
  #
  # Reasoning models emit reasoning before content, so the output budget must
  # cover both.
  primary_model: "recursive/flint-v1.0:free"
  # Software cap for the OpenRouter free channel (PROJECT_GUIDE 5.13):
  # 1000 calls per UTC day, enforced independently of the provider quota.
  daily_call_limit: 1000
  daily_cost_limit_usd: "0"
  # Paid channel admission requires both configured prices. Unknown prices
  # fail closed, even when fallback is enabled. Values are USD per million.
  input_cost_per_million: null
  output_cost_per_million: null
  max_output_tokens: 8192

trading:
  # off | on. `off` runs the whole cycle but stops before submitting.
  # YAML reads a bare `off` as a boolean; the loader treats that as "off"
  # and refuses an implicit boolean that would enable trading.
  #
  # The deployed LaunchAgent passes `--trading-mode on` explicitly, so this
  # file stays the safe default for any other invocation.
  trading_mode: off
  # Opportunity check cadence and its escalation guards (PROJECT_GUIDE 5.1).
  # The runtime scans the stored candles, strategy signals and broker facts
  # every `scan_interval_seconds` and only spends a full committee round
  # when a signal clears every guard below.
  #
  # A measured round costs 21-31 calls and the free channel is hard-capped
  # at 1000 calls per UTC day, so 15 rounds is at most ~465 calls and leaves
  # headroom for repair and shadow calls. A round that cannot get budget
  # records `skipped_model_budget` and never fabricates a decision. Both the
  # round cap and the spacing are read from durable history, so a restart
  # cannot hand the runtime a fresh allowance.
  opportunity:
    scan_interval_seconds: 180
    max_rounds_per_day: 15
    min_spacing_seconds: 600
    escalation_min_confidence: "0.60"
    # A flat scan spends nothing: the committee only runs when a strategy
    # produced a directional signal that cleared every strategy threshold.
    # Escalating on flat was briefly enabled and, combined with a broken
    # round counter, produced 2015 model calls in one UTC day against a
    # 1000-call ceiling. The guards above bound the spend; this keeps a day
    # with no signal at zero.
    escalate_on_flat: false
  # Reviewed committee thresholds (GUIDE 5.4). These are the numbers applied
  # after the models answer, and they are the reason a plan becomes no_trade.
  #
  # AGENTS 8.6: these values may only be tightened. The loader rejects any
  # attempt to release them, so this section can raise a floor or require a
  # stronger consensus but can never widen what reaches the RiskGate. They are
  # stated explicitly here so the running configuration is readable, not
  # inherited silently from a code default.
  discipline:
    no_trade_below_confidence: "0.55"
    min_analysts_supporting_direction: 2
    require_min_consensus: split
    honour_risk_role_veto: true
    max_position_pct: "0.25"
