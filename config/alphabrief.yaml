# AlphaBrief non-secret configuration.
#
# Schema version 1. Unknown keys are rejected by the loader so a typo can
# never silently disable a safety-relevant setting.
schema_version: 1

model:
  # The main channel is always the ChatGPT subscription sign-in. The
  # fallback channel is used only when this is explicitly true, so a
  # billing channel can never switch silently.
  fallback_enabled: false
  # Globally locked to GPT 6 Luna per operator directive.
  primary_model: "gpt-6-luna"
  # Daily budget (PROJECT_GUIDE 5.13). The subscription channel is capped
  # by call count, the optional paid fallback by estimated USD cost.
  daily_call_limit: 150
  daily_cost_limit_usd: "2.00"
  # Paid channel admission requires both configured prices. Unknown prices
  # fail closed, even when fallback is enabled. Values are USD per million.
  input_cost_per_million: null
  output_cost_per_million: null
  max_output_tokens: 2048

trading:
  # off | on. `off` runs the whole cycle but stops before submitting.
  trading_mode: off
