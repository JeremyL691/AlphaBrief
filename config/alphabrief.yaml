# AlphaBrief non-secret configuration.
#
# Schema version 1. Unknown keys are rejected by the loader so a typo can
# never silently disable a safety-relevant setting.
schema_version: 1

model:
  # Free availability and pricing are rechecked per call, not guaranteed.
  primary_channel: openrouter_free
  fallback_enabled: false
  # Verified live 2026-10-13: exact model ID echoed, zero catalog pricing,
  # no upstream shared-pool rate limit. Reasoning models emit reasoning
  # before content, so the output budget must cover both.
  primary_model: "nvidia/nemotron-3-super-120b-a12b:free"
  # Software cap for the OpenRouter free channel (PROJECT_GUIDE 5.13):
  # 1000 calls per UTC day, enforced independently of the provider quota.
  daily_call_limit: 1000
  daily_cost_limit_usd: "0"
  # Paid channel admission requires both configured prices. Unknown prices
  # fail closed, even when fallback is enabled. Values are USD per million.
  input_cost_per_million: null
  output_cost_per_million: null
  max_output_tokens: 8192

trading:
  # off | on. `off` runs the whole cycle but stops before submitting.
  # YAML reads a bare `off` as a boolean; the loader treats that as "off"
  # and refuses an implicit boolean that would enable trading.
  #
  # The deployed LaunchAgent passes `--trading-mode on` explicitly, so this
  # file stays the safe default for any other invocation.
  trading_mode: off
  # Opportunity check cadence and its escalation guards (PROJECT_GUIDE 5.1).
  # The runtime scans the stored candles, strategy signals and broker facts
  # every `scan_interval_seconds` and only spends a full committee round
  # when a signal clears every guard below.
  #
  # Operator directive (2026-10-20): guarantee at least five committee
  # rounds per session day, more when the guards allow. The budget ceiling
  # does the real bounding: the free channel is hard-capped at 1000 calls
  # per UTC day and a measured round costs 21-31 calls, so 20 rounds is
  # about 620 calls and still leaves headroom for repair and shadow calls.
  # A round that cannot get budget records `skipped_model_budget` and never
  # fabricates a decision.
  opportunity:
    scan_interval_seconds: 120
    max_rounds_per_day: 20
    min_spacing_seconds: 900
    escalation_min_confidence: "0.60"
    # A flat scan still escalates: the committee decides (it may close or
    # hold), and the round record is durable evidence the runtime was alive.
    # `max_rounds_per_day` and `min_spacing_seconds` still bound the spend.
    escalate_on_flat: true
  # Reviewed committee thresholds (GUIDE 5.4). These are the numbers applied
  # after the models answer, and they are the reason a plan becomes no_trade.
  #
  # Operator directive (2026-10-20): the soak run is a capability test, not a
  # profitability test, and the goal is real fills on the practice account.
  # The floor, the analyst quorum and the risk veto are therefore released so
  # the committee's opinion reaches the RiskGate instead of being zeroed here.
  # The RiskGate itself (14 deterministic rules: exposure, margin, daily loss,
  # drawdown, spread, protective orders) is unchanged and still has to approve
  # every order. `max_position_pct` is raised to 0.95 so a plan's target is
  # not clamped here; the per-order notional and total exposure caps in the
  # RiskGate remain the binding limits.
  discipline:
    no_trade_below_confidence: "0"
    min_analysts_supporting_direction: 0
    require_min_consensus: no_consensus
    honour_risk_role_veto: false
    max_position_pct: "0.95"
