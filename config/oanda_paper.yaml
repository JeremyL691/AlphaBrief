# OANDA Paper broker non-secret configuration.
#
# Credentials (bearer token, account ID) are NEVER stored here. They are read
# from environment variables:
#   ALPHABRIEF_OANDA_TOKEN
#   ALPHABRIEF_OANDA_ACCOUNT_ID
# See AGENTS.md: keys must never be committed, logged, or embedded.
base_url: https://api-fxpractice.oanda.com
request_timeout_seconds: 5.0
max_order_attempts: 3
retry_backoff_seconds: 0.25
