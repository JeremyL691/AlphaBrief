[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "alphabrief"
version = "0.0.0"
description = "Local-first AI quant research and paper-trading workbench."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.100,<1",
    "pydantic>=2.10,<3",
    "typer>=0.12,<1",
    "uvicorn[standard]>=0.20,<1",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.10",
    "pytest>=8.0",
    "ruff>=0.5",
]

[project.scripts]
alphabrief = "alphabrief_cli.main:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = [
    "apps/api/src",
    "apps/cli/src",
    "packages/alphabrief-backtest/src",
    "packages/alphabrief-core/src",
    "packages/alphabrief-data/src",
    "packages/alphabrief-execution/src",
    "packages/alphabrief-gym/src",
    "packages/alphabrief-models/src",
    "packages/alphabrief-review/src",
    "packages/alphabrief-risk/src",
    "packages/alphabrief-strategy/src",
]

[tool.setuptools.packages.find]
where = [
    "apps/api/src",
    "apps/cli/src",
    "packages/alphabrief-backtest/src",
    "packages/alphabrief-core/src",
    "packages/alphabrief-data/src",
    "packages/alphabrief-execution/src",
    "packages/alphabrief-gym/src",
    "packages/alphabrief-models/src",
    "packages/alphabrief-review/src",
    "packages/alphabrief-risk/src",
    "packages/alphabrief-strategy/src",
]

[tool.ruff]
line-length = 88
target-version = "py312"
extend-exclude = [
    "_reference_sources",
]

[tool.ruff.lint.per-file-ignores]
"apps/cli/**/*.py" = ["B008"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = [
    "apps/api/src",
    "apps/cli/src",
    "packages/alphabrief-backtest/src",
    "packages/alphabrief-core/src",
    "packages/alphabrief-data/src",
    "packages/alphabrief-execution/src",
    "packages/alphabrief-gym/src",
    "packages/alphabrief-models/src",
    "packages/alphabrief-review/src",
    "packages/alphabrief-risk/src",
    "packages/alphabrief-strategy/src",
]
files = [
    "apps/api/src",
    "packages/alphabrief-backtest/src",
    "packages/alphabrief-core/src",
    "packages/alphabrief-data/src",
    "packages/alphabrief-execution/src",
    "packages/alphabrief-gym/src",
    "packages/alphabrief-models/src",
    "packages/alphabrief-review/src",
    "packages/alphabrief-risk/src",
    "packages/alphabrief-strategy/src",
    "tests",
]
