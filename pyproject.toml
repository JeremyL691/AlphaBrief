[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "alphabrief"
version = "1.0.0-rc.1"
description = "Local-first AI quant research and paper-trading workbench."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "certifi>=2024.0",
    "duckdb>=1.0,<2",
    "fastapi>=0.100,<1",
    "numpy>=2.0",
    "pydantic>=2.10,<3",
    "pytz>=2024",
    "pyyaml>=6.0,<7",
    "typer>=0.12,<1",
    "uvicorn[standard]>=0.20,<1",
]

[project.optional-dependencies]
dev = [
    "axe-playwright-python>=0.1",
    "pyinstaller>=6.10",
    "httpx==0.28.1",
    "mypy>=1.10",
    "playwright>=1.40",
    "pytest>=8.0",
    "ruff>=0.5",
    "types-PyYAML>=6.0",
]

[project.scripts]
alphabrief = "alphabrief_cli.main:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "practice: needs real credentials and network (OANDA practice / model channels); CI runs -m \"not practice\"",
]
python_files = ["test_*.py"]
pythonpath = [
    "apps/api/src",
    "apps/cli/src",
    "packages/alphabrief-backtest/src",
    "packages/alphabrief-core/src",
    "packages/alphabrief-data/src",
    "packages/alphabrief-execution/src",
    "packages/alphabrief-gym/src",
    "packages/alphabrief-models/src",
    "packages/alphabrief-news/src",
    "packages/alphabrief-review/src",
    "packages/alphabrief-risk/src",
    "packages/alphabrief-strategy/src",
    "packages/alphabrief-trader/src",
    "tests",
]

[tool.setuptools.packages.find]
where = [
    "apps/api/src",
    "apps/cli/src",
    "packages/alphabrief-backtest/src",
    "packages/alphabrief-core/src",
    "packages/alphabrief-data/src",
    "packages/alphabrief-execution/src",
    "packages/alphabrief-gym/src",
    "packages/alphabrief-models/src",
    "packages/alphabrief-news/src",
    "packages/alphabrief-review/src",
    "packages/alphabrief-risk/src",
    "packages/alphabrief-strategy/src",
    "packages/alphabrief-trader/src",
    "tests",
]

[tool.ruff]
line-length = 88
target-version = "py312"
extend-exclude = [
    "_reference_sources",
]

[tool.ruff.lint.per-file-ignores]
"apps/cli/**/*.py" = ["B008"]
"apps/api/src/alphabrief_api/routes/risk.py" = ["B008"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
explicit_package_bases = true
mypy_path = [
    "apps/api/src",
    "apps/cli/src",
    "packages/alphabrief-backtest/src",
    "packages/alphabrief-core/src",
    "packages/alphabrief-data/src",
    "packages/alphabrief-execution/src",
    "packages/alphabrief-gym/src",
    "packages/alphabrief-models/src",
    "packages/alphabrief-news/src",
    "packages/alphabrief-review/src",
    "packages/alphabrief-risk/src",
    "packages/alphabrief-strategy/src",
    "packages/alphabrief-trader/src",
    "tests",
]
files = [
    "apps/api/src",
    "packages/alphabrief-backtest/src",
    "packages/alphabrief-core/src",
    "packages/alphabrief-data/src",
    "packages/alphabrief-execution/src",
    "packages/alphabrief-gym/src",
    "packages/alphabrief-models/src",
    "packages/alphabrief-news/src",
    "packages/alphabrief-review/src",
    "packages/alphabrief-risk/src",
    "packages/alphabrief-strategy/src",
    "packages/alphabrief-trader/src",
    "tests",
]

[[tool.mypy.overrides]]
# axe_playwright_python ships no py.typed marker or stubs; the import is
# exercised by the S6 accessibility tests at runtime.
module = "axe_playwright_python.*"
ignore_missing_imports = true
