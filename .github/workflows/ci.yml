name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: lint, types, tests, secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install the project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Ruff
        run: python -m ruff check .

      - name: Mypy
        run: python -m mypy

      # Practice-marked tests need real OANDA practice credentials and a
      # network path to api-fxpractice.oanda.com; they run on the
      # developer machine per PROJECT_GUIDE section 7.
      - name: Tests
        run: python -m pytest -q -m "not practice"

      - name: Secret scan
        run: python scripts/secret_scan.py
