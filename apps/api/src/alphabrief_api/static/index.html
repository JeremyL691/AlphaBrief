<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AlphaBrief - AI FX Trading Workstation</title>
  <link rel="stylesheet" href="./design-tokens.css" />
  <link rel="stylesheet" href="./app.css" />
</head>
<body>
  <!-- Inline SVG Sprite for Lucide Icons -->
  <svg xmlns="http://www.w3.org/2000/svg" style="display: none;">
    <symbol id="icon-dashboard" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect width="7" height="9" x="3" y="3" rx="1"/>
      <rect width="7" height="5" x="14" y="3" rx="1"/>
      <rect width="7" height="9" x="14" y="12" rx="1"/>
      <rect width="7" height="5" x="3" y="16" rx="1"/>
    </symbol>
    <symbol id="icon-committee" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/>
      <circle cx="9" cy="7" r="4"/>
      <path d="M22 21v-2a4 4 0 0 0-3-3.87"/>
      <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
    </symbol>
    <symbol id="icon-orders" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 2v20l2-1 2 1 2-1 2 1 2-1 2 1 2-1 2 1V2l-2 1-2-1-2 1-2-1-2 1-2-1-2 1Z"/>
      <path d="M16 8h-6"/>
      <path d="M16 12h-6"/>
      <path d="M14 16h-4"/>
    </symbol>
    <symbol id="icon-news" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 22h16a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2H8a2 2 0 0 0-2 2v16a2 2 0 0 1-2 2Zm0 0a2 2 0 0 1-2-2v-9c0-1.1.9-2 2-2h2"/>
      <path d="M18 14h-8"/>
      <path d="M15 18h-5"/>
      <path d="M10 6h8v4h-8V6Z"/>
    </symbol>
    <symbol id="icon-risk" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10"/>
      <path d="m12 8 0 4"/>
      <path d="m12 16 .01 0"/>
    </symbol>
    <symbol id="icon-evaluation" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/>
      <polyline points="16 7 22 7 22 13"/>
    </symbol>
    <symbol id="icon-backtest" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="10"/>
      <polyline points="12 6 12 12 16 14"/>
    </symbol>
    <symbol id="icon-strategies" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect width="16" height="16" x="4" y="4" rx="2"/>
      <rect width="6" height="6" x="9" y="9" rx="1"/>
      <path d="M15 2v2"/>
      <path d="M15 20v2"/>
      <path d="M2 15h2"/>
      <path d="M2 9h2"/>
      <path d="M20 15h2"/>
      <path d="M20 9h2"/>
      <path d="M9 2v2"/>
      <path d="M9 20v2"/>
    </symbol>
    <symbol id="icon-review" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/>
      <polyline points="14 2 14 8 20 8"/>
      <line x1="16" x2="8" y1="13" y2="13"/>
      <line x1="16" x2="8" y1="17" y2="17"/>
      <line x1="10" x2="8" y1="9" y2="9"/>
    </symbol>
    <symbol id="icon-settings" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/>
      <circle cx="12" cy="12" r="3"/>
    </symbol>
    <symbol id="icon-onboarding" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="m12 3-1.9 5.8a2 2 0 0 1-1.3 1.3L3 12l5.8 1.9a2 2 0 0 1 1.3 1.3L12 21l1.9-5.8a2 2 0 0 1 1.3-1.3L21 12l-5.8-1.9a2 2 0 0 1-1.3-1.3Z"/>
    </symbol>
    <symbol id="icon-power" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M18.36 6.64a9 9 0 1 1-12.73 0"/>
      <line x1="12" x2="12" y1="2" y2="12"/>
    </symbol>
    <symbol id="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="4"/>
      <path d="M12 2v2"/>
      <path d="M12 20v2"/>
      <path d="m4.93 4.93 1.41 1.41"/>
      <path d="m17.66 17.66 1.41 1.41"/>
      <path d="M2 12h2"/>
      <path d="M20 12h2"/>
      <path d="m6.34 17.66-1.41 1.41"/>
      <path d="m19.07 4.93-1.41 1.41"/>
    </symbol>
    <symbol id="icon-globe" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="10"/>
      <line x1="2" x2="22" y1="12" y2="12"/>
      <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
    </symbol>
    <symbol id="icon-alert-triangle" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/>
      <line x1="12" x2="12" y1="9" y2="13"/>
      <line x1="12" x2="12.01" y1="17" y2="17"/>
    </symbol>
    <symbol id="icon-alert-circle" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="10"/>
      <line x1="12" x2="12" y1="8" y2="12"/>
      <line x1="12" x2="12.01" y1="16" y2="16"/>
    </symbol>
  </svg>

  <div id="offline-banner" class="offline-banner" style="display: none;" role="alert">
    <span>服务离线: 无法连接本地后台 (127.0.0.1) / Service offline: backend unreachable</span>
    <button class="btn-control" onclick="window.app.render()">重试连接 / Reconnect</button>
  </div>

  <div id="app">
    <!-- Sidebar -->
    <nav class="sidebar" aria-label="Main Navigation">
      <div class="brand-section">
        <div class="brand-header">
          <span class="brand-title">AlphaBrief</span>
          <span class="badge-practice">Practice</span>
        </div>
      </div>

      <ul class="nav-menu">
        <li class="nav-item">
          <a href="#overview" class="nav-link active" data-route="overview">
            <svg class="nav-icon"><use href="#icon-dashboard"></use></svg>
            <span>总览 / Overview</span>
          </a>
        </li>
        <li class="nav-item">
          <a href="#committee" class="nav-link" data-route="committee">
            <svg class="nav-icon"><use href="#icon-committee"></use></svg>
            <span>委员会 / Committee</span>
          </a>
        </li>
        <li class="nav-item">
          <a href="#orders" class="nav-link" data-route="orders">
            <svg class="nav-icon"><use href="#icon-orders"></use></svg>
            <span>订单 / Orders</span>
          </a>
        </li>
        <li class="nav-item">
          <a href="#news" class="nav-link" data-route="news">
            <svg class="nav-icon"><use href="#icon-news"></use></svg>
            <span>新闻 / News</span>
          </a>
        </li>
        <li class="nav-item">
          <a href="#risk" class="nav-link" data-route="risk">
            <svg class="nav-icon"><use href="#icon-risk"></use></svg>
            <span>风控 / Risk Gate</span>
          </a>
        </li>
        <li class="nav-item">
          <a href="#evaluation" class="nav-link" data-route="evaluation">
            <svg class="nav-icon"><use href="#icon-evaluation"></use></svg>
            <span>影子评估 / Eval</span>
          </a>
        </li>
        <li class="nav-item">
          <a href="#backtest" class="nav-link" data-route="backtest">
            <svg class="nav-icon"><use href="#icon-backtest"></use></svg>
            <span>回测 / Backtest</span>
          </a>
        </li>
        <li class="nav-item">
          <a href="#strategies" class="nav-link" data-route="strategies">
            <svg class="nav-icon"><use href="#icon-strategies"></use></svg>
            <span>策略 / Strategies</span>
          </a>
        </li>
        <li class="nav-item">
          <a href="#review" class="nav-link" data-route="review">
            <svg class="nav-icon"><use href="#icon-review"></use></svg>
            <span>复盘 / Review</span>
          </a>
        </li>
        <li class="nav-item">
          <a href="#settings" class="nav-link" data-route="settings">
            <svg class="nav-icon"><use href="#icon-settings"></use></svg>
            <span>设置 / Settings</span>
          </a>
        </li>
        <li class="nav-item">
          <a href="#onboarding" class="nav-link" data-route="onboarding">
            <svg class="nav-icon"><use href="#icon-onboarding"></use></svg>
            <span>引导 / Onboarding</span>
          </a>
        </li>
      </ul>

      <div class="sidebar-footer">
        <button class="btn-control" onclick="window.app.toggleLanguage()" aria-label="Toggle language">
          <svg class="nav-icon"><use href="#icon-globe"></use></svg>
          <span>中 / EN</span>
        </button>
        <button class="btn-control" onclick="window.app.toggleTheme()" aria-label="Toggle theme">
          <svg class="nav-icon"><use href="#icon-sun"></use></svg>
        </button>
      </div>
    </nav>

    <!-- Main Content Area -->
    <main class="main-wrapper" role="main">
      <header class="top-bar">
        <div class="top-bar-left">
          <div id="system-status-pill" class="system-status-pill online">
            <span class="status-dot"></span>
            <span>运行正常</span>
          </div>
        </div>
        <div class="top-bar-right">
          <button id="kill-switch-btn" class="btn-control" onclick="window.app.handleKillSwitchToggle()">
            <svg class="nav-icon"><use href="#icon-power"></use></svg>
            <span>紧急停止 / Kill Switch</span>
          </button>
        </div>
      </header>

      <section id="page-content" aria-live="polite">
        <!-- Rendered by app.js -->
      </section>
    </main>
  </div>

  <!-- Modal Dialog Container -->
  <div id="modal-overlay" class="modal-overlay" style="display: none;"></div>

  <script type="module" src="./app.js"></script>
</body>
</html>
